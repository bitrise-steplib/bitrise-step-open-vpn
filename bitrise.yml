format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  check:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git: { }

  e2e:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git:
        inputs:
        - workflow: e2e

  sample:
    envs:
    - HOST: $HOST
    - PORT: 1194
    - PROTO: udp
    - VPN_CA_CRT_BASE64: $VPN_CA_CRT_BASE64
    - VPN_CLIENT_CRT_BASE64: $VPN_CLIENT_CRT_BASE64
    - VPN_CLIENT_KEY_BASE64: $VPN_CLIENT_KEY_BASE64
    steps:
    - path::./:
        title: Connect to OpenVPN Server
        inputs:
        - host: $HOST
        - port: $PORT
        - proto: $PROTO
        - ca_crt: $VPN_CA_CRT_BASE64
        - client_crt: $VPN_CLIENT_CRT_BASE64
        - client_key: $VPN_CLIENT_KEY_BASE64

  generate_readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main: { }
